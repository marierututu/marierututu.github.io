<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4e8ef7">
<title>С днём рождения! 🥔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Neucha&family=Nunito:wght@900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#4e8ef7}
body{font-family:'Nunito',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.full{position:fixed;top:0;left:0;right:0;bottom:0}

#sky{z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse 75% 42% at 50% 50%,rgba(255,255,255,.45),rgba(255,255,255,0) 72%),linear-gradient(180deg,#4e8ef7 0%,#79adff 55%,#a3c7ff 100%)}
.cloud{position:absolute;left:0;animation:drift linear infinite}
.cloud svg{display:block;width:100%;height:100%}
@keyframes drift{from{transform:translateX(-110%)}to{transform:translateX(calc(100vw + 10%))}}

#stage{z-index:2;display:flex;flex-direction:column;touch-action:none;transition:opacity .6s ease}
#stage.out{opacity:0;pointer-events:none}
#pots{position:relative;flex:1;min-height:0;margin:calc(env(safe-area-inset-top,0px) + 2vh) 2vw 0;opacity:0;transform:translateY(24px) scale(.96);transition:opacity .6s ease,transform .7s cubic-bezier(.3,1.4,.5,1)}
#pots.ready{opacity:1;transform:none}
.slot{position:absolute;display:flex;align-items:flex-end;justify-content:center;transform:rotate(var(--rot,0deg));transform-origin:50% 90%}
.slot::after{content:'';position:absolute;left:24%;right:24%;bottom:-4px;height:11px;border-radius:50%;background:rgba(28,58,140,.25);filter:blur(3px);animation:shade var(--t,3s) ease-in-out infinite;animation-delay:var(--d,0s)}
.slot.poof{animation:poof .5s cubic-bezier(.3,.6,.4,1) forwards;pointer-events:none}
.pot{position:relative;z-index:1;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;transform-origin:50% 100%;cursor:pointer}
.pz{display:block;overflow:visible;pointer-events:none}
.pz .eye{transform-box:fill-box;transform-origin:center;transition:transform .07s ease}
.pz.bl .eye{transform:scaleY(.1)}
.pz .pupil{transition:transform .28s ease-out}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8%) rotate(2deg)}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1.04,.96)}30%{transform:translateY(0) scale(.97,1.03)}55%{transform:translateY(-10%) scale(.98,1.02)}80%{transform:translateY(0) scale(1.03,.97)}}
@keyframes shade{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.8);opacity:.6}}
@keyframes poof{
  0%{transform:translateY(0) rotate(var(--rot,0deg)) scale(1,1);opacity:1}
  22%{transform:translateY(0) rotate(var(--rot,0deg)) scale(1.18,.8);opacity:1}
  48%{transform:translateY(-14%) rotate(var(--rot,0deg)) scale(.9,1.15);opacity:1}
  100%{transform:translateY(-36%) rotate(calc(var(--rot,0deg) + 24deg)) scale(.15,.15);opacity:0}}
.puff{position:fixed;z-index:4;width:0;height:0;pointer-events:none}
.puff i{position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;background:#fff;border:2.5px solid #4a2a14;animation:puff .6s ease-out both}
@keyframes puff{0%{transform:rotate(var(--a)) translateX(6px) scale(.3);opacity:1}70%{opacity:1}100%{transform:rotate(var(--a)) translateX(40px) scale(1.15);opacity:0}}

#cta{flex:none;width:100%;padding:6px 16px 24px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);text-align:center;pointer-events:none;transition:opacity .4s ease,transform .4s ease}
#cta.gone{opacity:0;transform:translateY(24px)}
#cta .t{display:inline-block;font-weight:900;font-size:clamp(28px,8.4vw,46px);line-height:1.1;color:#fff;text-shadow:0 4px 0 #3a6fe0,0 10px 24px rgba(28,58,140,.35);animation:breathe 2.4s ease-in-out infinite}
#cta .n{display:inline-block;margin-top:10px;padding:3px 18px 4px;border-radius:999px;background:#fff;color:#3a6fe0;font-weight:900;font-size:clamp(20px,5.6vw,28px);line-height:1.2;box-shadow:0 4px 0 #3a6fe0}
#cta .n.bump{animation:bump .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}

#memes{z-index:5;pointer-events:none;overflow:hidden}
.meme{position:absolute;transform:translate(-50%,-50%) rotate(var(--r));animation:memeIn .45s cubic-bezier(.3,1.6,.5,1) both}
.meme img{display:block;box-sizing:content-box;border:5px solid #fff;border-radius:16px;background:#fff;box-shadow:0 16px 34px rgba(20,40,110,.38)}
.meme.bye{animation:memeOut .35s ease-in forwards}
@keyframes memeIn{from{opacity:0;transform:translate(-50%,-50%) rotate(calc(var(--r) - 30deg)) scale(.2)}to{opacity:1;transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}}
@keyframes memeOut{from{opacity:1;transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}to{opacity:0;transform:translate(-50%,-80%) rotate(calc(var(--r) + 12deg)) scale(.7)}}

#env{--ew:min(74vw,320px);position:fixed;left:50%;top:44%;z-index:6;width:var(--ew);height:calc(var(--ew) * .66);margin:calc(var(--ew) * -.33) 0 0 calc(var(--ew) * -.5);opacity:0;pointer-events:none}
#env.fall{opacity:1;pointer-events:auto;cursor:pointer;animation:envFall 1.15s cubic-bezier(.3,.7,.4,1) both}
#env.away{animation:envAway .55s ease-in forwards;pointer-events:none}
@keyframes envFall{0%{transform:translateY(-110vh) rotate(-24deg)}45%{transform:translateY(3vh) rotate(9deg)}62%{transform:translateY(-1.5vh) rotate(-6deg)}78%{transform:translateY(.8vh) rotate(3deg)}90%{transform:translateY(0) rotate(-1.5deg)}100%{transform:translateY(0) rotate(0deg)}}
@keyframes envAway{from{transform:translateY(0) rotate(0deg);opacity:1}to{transform:translateY(55vh) rotate(10deg);opacity:0}}
#env>div{position:absolute}
.e-back{top:0;left:0;right:0;bottom:0;z-index:0;background:#d7e4ff;border-radius:14px;box-shadow:0 22px 46px rgba(20,40,110,.35)}
.e-paper{left:7%;right:7%;top:5%;height:88%;z-index:2;background:#fffdf7;border-radius:10px}
.e-front{top:0;left:0;right:0;bottom:0;z-index:3;border-radius:0 0 14px 14px;overflow:hidden}
.e-flap{left:0;top:0;width:100%;height:58%;z-index:4;transform-origin:50% 0;transform:perspective(900px) rotateX(0deg);transition:transform .5s ease-in-out}
#env.open .e-flap{transform:perspective(900px) rotateX(180deg)}
.e-front svg,.e-flap svg{display:block;width:100%;height:100%}
.e-seal{left:50%;top:58%;z-index:5;width:calc(var(--ew) * .16);height:calc(var(--ew) * .16);transform:translate(-50%,-50%);border-radius:50%;background:#ff6b7a;box-shadow:0 3px 0 #d84a5c,0 8px 14px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;transition:transform .3s ease,opacity .3s ease}
.e-seal svg{width:50%;height:50%}
#env.open .e-seal{transform:translate(-50%,-50%) scale(1.7);opacity:0}

#fold{--fw:min(84vw,480px);--fh:min(21vh,170px);position:fixed;left:50%;top:44%;z-index:5;width:var(--fw);height:var(--fh);margin:calc(var(--fh) * -.5) 0 0 calc(var(--fw) * -.5);-webkit-perspective:1400px;perspective:1400px;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;transform:translateY(8vh) scale(.6);opacity:0;transition:transform .75s cubic-bezier(.3,1.2,.5,1),opacity .35s ease}
#fold.up{opacity:1;transform:translateY(-6vh) scale(1)}
#fold.fade{opacity:0;transition:opacity .5s ease}
.fp{position:absolute;left:0;width:100%;height:100%;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.45,.05,.3,1)}
.fp-m{top:0}
.fp-t{bottom:100%;transform-origin:50% 100%;transform:translateZ(2px) rotateX(-180deg)}
.fp-b{top:100%;transform-origin:50% 0;transform:translateZ(1px) rotateX(180deg)}
#fold.u1 .fp-t{transform:translateZ(0) rotateX(0deg)}
#fold.u2 .fp-b{transform:translateZ(0) rotateX(0deg)}
.ff,.fb{position:absolute;top:0;left:0;right:0;bottom:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:#fffdf7}
.ff{background-image:repeating-linear-gradient(180deg,transparent 0 25px,rgba(120,150,210,.28) 25px 26px);background-position:0 12px}
.fb{transform:rotateX(180deg);background:#f7f1e3;display:flex;align-items:center;justify-content:center}
.fb svg{width:34px;height:34px}
.fp-m .ff{border-radius:3px;box-shadow:0 16px 36px rgba(20,40,110,.32)}
.fp-t .ff,.fp-t .fb{border-radius:12px 12px 0 0}
.fp-b .ff,.fp-b .fb{border-radius:0 0 12px 12px}

#letter{z-index:8;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6vh 4vw 0;padding-top:calc(env(safe-area-inset-top,0px) + 6vh);background:rgba(24,48,120,.3);opacity:0;transition:opacity .6s ease}
#letter::after{content:'';display:block;height:calc(env(safe-area-inset-bottom,0px) + 8vh)}
#letter.on{opacity:1}
.paper{max-width:580px;margin:0 auto;background:#fffdf7;border-radius:22px;padding:30px 22px 36px;box-shadow:0 26px 60px rgba(20,40,110,.4);color:#26314f;font-family:'Neucha','Nunito',cursive;font-size:clamp(19px,5.2vw,23px);line-height:1.5;transform:scale(.97);transition:transform .6s ease;-webkit-user-select:text;user-select:text}
#letter.on .paper{transform:none}
.paper p{margin-bottom:.9em;opacity:0;transform:translateY(12px);animation:pin .7s ease forwards}
.paper p:last-child{margin-bottom:0}
@keyframes pin{to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="sky" class="full"></div>

<main id="stage" class="full">
  <div id="pots"></div>
  <div id="cta">
    <div><span class="t">потапай картошку</span></div>
    <div><span class="n" id="cntBox"><b id="cnt">0</b> / <span id="need">6</span></span></div>
  </div>
</main>

<div id="memes" class="full"></div>

<div id="env">
  <div class="e-back"></div>
  <div class="e-paper"></div>
  <div class="e-front"><svg viewBox="0 0 100 66" preserveAspectRatio="none"><path d="M0 4L50 38L100 4V66H0Z" fill="#fff"/><path d="M0 66L50 38L100 66" fill="none" stroke="#d3e0fb" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg></div>
  <div class="e-flap"><svg viewBox="0 0 100 38" preserveAspectRatio="none"><path d="M0 0H100L50 38Z" fill="#f2f6ff" stroke="#d3e0fb" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg></div>
  <div class="e-seal"><svg viewBox="0 0 24 24"><path d="M12 21C5 16 2 12.5 2 8.5C2 5.5 4.3 3.5 7 3.5C9 3.5 10.8 4.7 12 6.5C13.2 4.7 15 3.5 17 3.5C19.7 3.5 22 5.5 22 8.5C22 12.5 19 16 12 21Z" fill="#fff"/></svg></div>
</div>

<div id="fold" hidden>
  <div class="fp fp-m"><div class="ff"></div></div>
  <div class="fp fp-b"><div class="ff"></div><div class="fb"></div></div>
  <div class="fp fp-t"><div class="ff"></div><div class="fb"><svg viewBox="0 0 24 24"><path d="M12 21C5 16 2 12.5 2 8.5C2 5.5 4.3 3.5 7 3.5C9 3.5 10.8 4.7 12 6.5C13.2 4.7 15 3.5 17 3.5C19.7 3.5 22 5.5 22 8.5C22 12.5 19 16 12 21Z" fill="#ff6b7a"/></svg></div></div>
</div>

<div id="letter" class="full" hidden><div class="paper" id="paper"></div></div>

<script>
/* ===== НАСТРОЙКИ ===== */
const CONFIG = {
  taps: 6, // сколько картошек натапать до письма
  // мемы = все картинки на главной странице репозитория; запасные имена, если список не загрузится:
  memes: Array.from({ length: 15 }, (_, i) => 'meme' + (i + 1) + '.jpg'),
};

const LETTER = `потато! я поздравляю вас с вашим днем рождения!! 
я не знаю какими материальными подарками вас можно удивить, но я бы просто хотела в этот день вас немножко порадовать и сказать какой вы крутой. а вы ряльна супер крутой, потата, эта чистая правда! никогда не сомневайтесь в своей крутости, не сомневайтесь в своих способностях и возможностях, продолжайте следовать своей цели и не тильтуйте!!!!!!!! 
я хочу вам искренне пожелать, чтобы вы были счастливы. пусть вас окружают люди, которые будут всегда за вас и с вами, которые будут по-настоящему вас ценить и приносить вам столько же добра и радости, сколько вы даете окружающим
хочу вам также пожелать здоровья, потато. вы зря не слушаити моих коллов конечно, но здоровье это самое ценное что у нас есть, что нельзя будет купить ни за какие деньги в будущем. никакие усилия и работа не стоят вашего здоровья и эта факт. берегите себя и своих близких! будьте здоровы, потато
ну и ,конечно, хочу вам пожелать удачи. я считаю, что  20% любого успеха это удача. с усердной работой и трудом она обязательно придёт. так вот пусть она сопутствует вам на всем жизненном пути, не только в работе. желаю вам оказаться в нужном месте и в нужное время, потато! пусть все ваши цели осуществятся, желания исполнятся, мечты сбудяца и вы наконец поедете отдыхать, путешествовать, ловить солнышко, любоваться горами и наслаждаться жизнью! 
а вообще потата мой колл вам: не ждите момента чтобы быть счастливым. живити сейчас, кайфуйте от вашей жизни и берите из нее максимум. стакан наполовину полон, понимаити??жизнь слишком коротка чтобы тильтовать. а количество счастья в ней зависит от того, сколько вы сами сможете разглядеть. я верю что все у вас получится, потата. все сложится так, как надо, поверьте. доверьтесь процессу 
карочи с вашим личным новым годом вас!!! растите крутой картофелиной, не будьте пюрешкой🥔🥔🥔🥔🥔🥔🍓🍓🍓🍓🍓`;
/* ===================== */

const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const f1 = v => v.toFixed(1);
const later = (ms, v) => new Promise(r => setTimeout(() => r(v), ms));
const IMG_RE = /\.(png|jpe?g|gif|webp|avif|heic|heif)$/i;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const pick = a => a[Math.random() * a.length | 0];

/* облака */
const CLOUD = '<svg viewBox="0 -8 120 58" preserveAspectRatio="none"><path d="M25 48a17 17 0 0 1 0-34a22 22 0 0 1 40-8a18 18 0 0 1 30 10a16 16 0 0 1 0 32Z" fill="#fff"/></svg>';
[[6, 190, .9, 85, -20], [22, 120, .55, 62, -48], [40, 150, .45, 100, -75], [63, 110, .5, 72, -10], [80, 170, .65, 90, -58]].forEach(([top, w, o, t, d]) => {
  const c = document.createElement('div');
  c.className = 'cloud';
  c.style.cssText = 'top:' + top + '%;width:' + w + 'px;height:' + Math.round(w * .48) + 'px;opacity:' + o + ';animation-duration:' + t + 's;animation-delay:' + d + 's';
  c.innerHTML = CLOUD;
  $('#sky').appendChild(c);
});

/* ===== рисованные картошки ===== */
const INK = '#4a2a14';
const PALS = [
  { fill: '#f3c56f', hatch: '#c4893d', spot: '#a86d32' },
  { fill: '#e4ad6c', hatch: '#b07434', spot: '#8f5a28' },
  { fill: '#f6d896', hatch: '#cf9e55', spot: '#b5813f' },
  { fill: '#eba98b', hatch: '#c07457', spot: '#a35a40' },
  { fill: '#dba763', hatch: '#a86f30', spot: '#7f5225' },
];
const HEADS = ['tophat', 'cap', 'beanie', 'bucket', 'candle', 'phones'];
const EYEWEAR = ['shades', 'pixel', 'specs', 'stars'];
const NECKS = ['chain', 'bowtie'];
const HANDS = ['money', 'cash'];
const MOUTHS = ['grin', 'teeth', 'smile', 'cat', 'blep', 'smirk'];
const BRIGHT = ['#ff5c7a', '#7fe0c3', '#ffd35c', '#a78bfa', '#5cc8ff', '#ff9f43'];

function smooth(P) {
  const n = P.length;
  let d = 'M' + f1(P[0][0]) + ' ' + f1(P[0][1]);
  for (let i = 0; i < n; i++) {
    const a = P[(i + n - 1) % n], b = P[i], c = P[(i + 1) % n], e = P[(i + 2) % n];
    d += 'C' + f1(b[0] + (c[0] - a[0]) / 6) + ' ' + f1(b[1] + (c[1] - a[1]) / 6) + ' ' + f1(c[0] - (e[0] - b[0]) / 6) + ' ' + f1(c[1] - (e[1] - b[1]) / 6) + ' ' + f1(c[0]) + ' ' + f1(c[1]);
  }
  return d + 'Z';
}
function bodyPts(b, off) {
  const P = [];
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2;
    const k = 1 + b.a1 * Math.sin(2 * a + b.p1) + b.a2 * Math.sin(3 * a + b.p2) + b.j[i];
    const o = typeof off === 'function' ? off(a) : off;
    P.push([b.cx + Math.cos(a) * (b.rx * k * (1 + .07 * Math.sin(a)) + o), b.cy + Math.sin(a) * (b.ry * k + o)]);
  }
  return P;
}
function wobCircle(x, y, r, sy) {
  const P = [];
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2, k = r * (1 + (Math.random() - .5) * .1); P.push([x + Math.cos(a) * k, y + Math.sin(a) * k * (sy || 1)]); }
  return smooth(P);
}
function starPath(x, y, R) {
  let d = '';
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? R * .48 : R; d += (i ? 'L' : 'M') + f1(x + Math.cos(a) * r) + ' ' + f1(y + Math.sin(a) * r); }
  return d + 'Z';
}

let UID = 0;
function potatoSVG(o) {
  const id = 'pz' + (UID++), pal = o.pal;
  const b = { cx: 70, cy: 112, rx: o.rx, ry: o.ry, a1: rnd(.02, .05), a2: rnd(.015, .035), p1: rnd(0, 6.3), p2: rnd(0, 6.3) };
  const p3 = rnd(0, 6.3), p4 = rnd(0, 6.3);
  const frames = [0, 1, 2].map(() => {
    const bb = Object.assign({}, b, { j: Array.from({ length: 16 }, () => (Math.random() - .5) * .035) });
    const q3 = p3 + rnd(-.5, .5), q4 = p4 + rnd(-.5, .5);
    const th = a => 3.3 + 1.4 * Math.sin(2 * a + q3) + .6 * Math.sin(5 * a + q4);
    return { pts: bodyPts(bb, 0), fill: smooth(bodyPts(bb, -.5)), ring: smooth(bodyPts(bb, a => th(a) / 2)) + smooth(bodyPts(bb, a => -th(a) / 2)), sketch: smooth(bodyPts(bb, .6)) };
  });
  const F = frames[0];
  const top = Math.min.apply(null, F.pts.map(p => p[1]));
  const minX = Math.min.apply(null, F.pts.map(p => p[0])), maxX = Math.max.apply(null, F.pts.map(p => p[0]));
  const cx = b.cx, cy = b.cy, rx = b.rx, ry = b.ry;
  const er = Math.max(8, Math.min(10.5, rx * .22)), ey = cy - ry * .16, ex1 = cx - rx * .36, ex2 = cx + rx * .36;
  const mx = cx, my = ey + er * 2, s = rx * .2;
  const S = `fill="none" stroke="${INK}" stroke-linecap="round" stroke-linejoin="round"`;
  const hidesEyes = o.eyew === 'shades' || o.eyew === 'pixel' || o.eyew === 'stars';
  let back = '', body = '', front = '', hat = '', eyes = '', over = '';

  /* сзади: ножки, ручки, свечка, дужка наушников */
  const fy = cy + ry * .97, fl = cx - rx * .38, fr = cx + rx * .38, ny = cy + ry * .12;
  back += `<ellipse cx="${f1(fl)}" cy="${f1(fy)}" rx="11" ry="6.2" fill="#7b4a26" stroke="${INK}" stroke-width="2.2" transform="rotate(-6 ${f1(fl)} ${f1(fy)})"/>`;
  back += `<ellipse cx="${f1(fr)}" cy="${f1(fy)}" rx="11" ry="6.2" fill="#7b4a26" stroke="${INK}" stroke-width="2.2" transform="rotate(6 ${f1(fr)} ${f1(fy)})"/>`;

  /* глаза */

    const big = x => `<g class="eye">
