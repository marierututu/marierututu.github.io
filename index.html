<script>
window.onerror = function (m, s, l) {
  var t = 'Ошибка: ' + m + (l ? ' (строка ' + l + ')' : '');
  var show = function () { var d = document.getElementById('err'); if (!d) { d = document.createElement('div'); d.id = 'err'; document.body.appendChild(d); } d.textContent = t; };
  if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
};

<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#f8f5f3}
body{font-family:'Nunito',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.full{position:fixed;top:0;left:0;right:0;bottom:0}
#err{position:fixed;left:6px;top:6px;z-index:99;max-width:92vw;padding:4px 7px;border-radius:6px;background:rgba(255,255,255,.94);color:#b00020;font:12px/1.35 monospace}

#bg{z-index:0;pointer-events:none;overflow:hidden;background:#f8f5f3}
#bg svg{display:block}

#stage{z-index:2;display:flex;flex-direction:column;touch-action:none;transition:opacity .5s ease,transform .5s ease}
#stage.out{opacity:0;transform:scale(.92);pointer-events:none}
#pots{position:relative;flex:1;min-height:0;margin:calc(env(safe-area-inset-top,0px) + 2vh) 2vw 0;animation:potsIn .7s ease both}
@keyframes potsIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.slot{position:absolute;display:flex;align-items:flex-end;justify-content:center;transform:rotate(var(--rot,0deg));transform-origin:50% 90%}
.slot::after{content:'';position:absolute;left:24%;right:24%;bottom:-4px;height:11px;border-radius:50%;background:rgba(90,70,80,.16);filter:blur(3px);animation:shade var(--t,3s) ease-in-out infinite;animation-delay:var(--d,0s)}
.slot.poof{animation:poof .5s cubic-bezier(.3,.6,.4,1) forwards;pointer-events:none}
.pot{position:relative;z-index:1;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;transform-origin:50% 100%;cursor:pointer}
.pz{display:block;overflow:visible;pointer-events:none}
.pz .eye{transform-box:fill-box;transform-origin:center;transition:transform .07s ease}
.pz.bl .eye{transform:scaleY(.1)}
.pz .pupil{transition:transform .28s ease-out}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8%) rotate(2deg)}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1.04,.96)}30%{transform:translateY(0) scale(.97,1.03)}55%{transform:translateY(-10%) scale(.98,1.02)}80%{transform:translateY(0) scale(1.03,.97)}}
@keyframes shade{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.8);opacity:.6}}
@keyframes poof{
  0%{transform:translateY(0) rotate(var(--rot,0deg)) scale(1,1);opacity:1}
  22%{transform:translateY(0) rotate(var(--rot,0deg)) scale(1.18,.8);opacity:1}
  48%{transform:translateY(-14%) rotate(var(--rot,0deg)) scale(.9,1.15);opacity:1}
  100%{transform:translateY(-36%) rotate(calc(var(--rot,0deg) + 24deg)) scale(.15,.15);opacity:0}}
.coin{position:fixed;z-index:4;width:64px;height:64px;margin:-32px 0 0 -32px;pointer-events:none;animation:coinUp 1.25s ease-out forwards}
.coin svg{display:block;width:100%;height:100%;overflow:visible}
.coin circle,.coin path{fill:none;stroke:#e0a21b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:160;stroke-dashoffset:160;animation:draw .5s ease-out forwards}
.coin .c2{stroke-width:2;animation-delay:.1s}
.coin .c3{stroke-width:2.4;animation-delay:.2s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes coinUp{0%{opacity:0;transform:translateY(6px) scale(.85)}12%{opacity:1;transform:translateY(0) scale(1)}65%{opacity:1;transform:translateY(-18px) scale(1)}100%{opacity:0;transform:translateY(-44px) scale(1.06)}}

#cta{flex:none;width:100%;padding:6px 16px 22px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center;pointer-events:none;transition:opacity .4s ease,transform .4s ease}
#cta.gone{opacity:0;transform:translateY(24px)}
#cta .t{font-weight:900;font-size:clamp(26px,7.8vw,42px);line-height:1.1;color:#3a2a35}
#cta .n{display:inline-block;margin-top:8px;padding:3px 18px 4px;border-radius:999px;background:#e0569c;color:#fff;font-weight:900;font-size:clamp(19px,5.4vw,26px);line-height:1.2;box-shadow:0 3px 0 #b03f7a}

#memes{z-index:5;pointer-events:none;overflow:hidden}

#fx{position:fixed;left:0;top:0;z-index:7;pointer-events:none}

#env{--ew:min(78vw,340px);position:fixed;left:50%;top:47%;z-index:6;width:var(--ew);height:calc(var(--ew) * .66);transform:translate(-50%,-50%) scale(0) rotate(-14deg);transition:transform .75s cubic-bezier(.3,1.5,.5,1),opacity .5s ease}
#env.in{transform:translate(-50%,-50%) scale(1) rotate(-3deg)}
#env.gone{opacity:0;transform:translate(-50%,-25%) scale(.85) rotate(-3deg)}
#env>div{position:absolute}
.e-back{top:0;left:0;right:0;bottom:0;z-index:0;background:#efe5f6;border-radius:14px;box-shadow:0 22px 46px rgba(80,55,100,.28)}
.e-paper{left:7%;right:7%;top:5%;height:88%;z-index:2;background:#fffdf9;border-radius:10px;transition:transform .8s cubic-bezier(.3,1.25,.5,1)}
.e-paper::before{content:'';position:absolute;left:14%;right:14%;top:14%;height:42%;background:repeating-linear-gradient(180deg,#ece3f3 0 3px,transparent 3px 12px)}
#env.peek .e-paper{transform:translateY(-55%)}
.e-front{top:0;left:0;right:0;bottom:0;z-index:3;border-radius:0 0 14px 14px;overflow:hidden}
.e-flap{left:0;top:0;width:100%;height:58%;z-index:4;transform-origin:50% 0;transform:perspective(900px) rotateX(0deg);transition:transform .6s ease-in-out}
#env.open .e-flap{transform:perspective(900px) rotateX(180deg)}
#env.peek .e-flap{z-index:1}
.e-front svg,.e-flap svg{display:block;width:100%;height:100%}
.e-seal{left:50%;top:58%;z-index:5;width:calc(var(--ew) * .16);height:calc(var(--ew) * .16);transform:translate(-50%,-50%);border-radius:50%;background:#e0569c;box-shadow:0 3px 0 #b03f7a,0 8px 14px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;transition:transform .3s ease,opacity .3s ease}
.e-seal svg{width:50%;height:50%}
#env.open .e-seal{transform:translate(-50%,-50%) scale(0);opacity:0}

#letter{z-index:8;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6vh 4vw 0;padding-top:calc(env(safe-area-inset-top,0px) + 6vh);background:rgba(70,50,90,.22);opacity:0;transition:opacity .6s ease}
#letter::after{content:'';display:block;height:calc(env(safe-area-inset-bottom,0px) + 8vh)}
#letter.on{opacity:1}
.paper{max-width:580px;margin:0 auto;background:#fffdf9;border-radius:22px;padding:30px 22px 36px;box-shadow:0 26px 60px rgba(70,50,90,.3);color:#3a2a35;font-family:'Neucha','Nunito',cursive;font-size:clamp(19px,5.2vw,23px);line-height:1.5;transform:translateY(60px) scale(.94);transition:transform .8s cubic-bezier(.3,1.3,.5,1);-webkit-user-select:text;user-select:text}
#letter.on .paper{transform:none}
.paper p{margin-bottom:.9em;opacity:0;transform:translateY(12px);animation:pin .7s ease forwards}
.paper p:last-child{margin-bottom:0}
@keyframes pin{to{opacity:1;transform:none}}
</style>
</head>

<script>
/* ===== НАСТРОЙКИ ===== */
const CONFIG = {

};

const LETTER = `потато! я поздравляю вас с вашим днем рождения!! 
я не знаю какими материальными подарками вас можно удивить, но я бы просто хотела в этот день вас немножко порадовать и сказать какой вы крутой. а вы ряльна супер крутой, потата, эта чистая правда! никогда не сомневайтесь в своей крутости, не сомневайтесь в своих способностях и возможностях, продолжайте следовать своей цели и не тильтуйте!!!!!!!! 
я хочу вам искренне пожелать, чтобы вы были счастливы. пусть вас окружают люди, которые будут всегда за вас и с вами, которые будут по-настоящему вас ценить и приносить вам столько же добра и радости, сколько вы даете окружающим
хочу вам также пожелать здоровья, потато. вы зря не слушаити моих коллов конечно, но здоровье это самое ценное что у нас есть, что нельзя будет купить ни за какие деньги в будущем. никакие усилия и работа не стоят вашего здоровья и эта факт. берегите себя и своих близких! будьте здоровы, потато
ну и ,конечно, хочу вам пожелать удачи. я считаю, что  20% любого успеха это удача. с усердной работой и трудом она обязательно придёт. так вот пусть она сопутствует вам на всем жизненном пути, не только в работе. желаю вам оказаться в нужном месте и в нужное время, потато! пусть все ваши цели осуществятся, желания исполнятся, мечты сбудяца и вы наконец поедете отдыхать, путешествовать, ловить солнышко, любоваться горами и наслаждаться жизнью! 
а вообще потата мой колл вам: не ждите момента чтобы быть счастливым. живити сейчас, кайфуйте от вашей жизни и берите из нее максимум. стакан наполовину полон, понимаити??жизнь слишком коротка чтобы тильтовать. а количество счастья в ней зависит от того, сколько вы сами сможете разглядеть. я верю что все у вас получится, потата. все сложится так, как надо, поверьте. доверьтесь процессу 
карочи с вашим личным новым годом вас!!! растите крутой картофелиной, не будьте пюрешкой🥔🥔🥔🥔🥔🥔🍓🍓🍓🍓🍓`;
/* ===================== */

const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const f1 = v => v.toFixed(1);
const later = (ms, v) => new Promise(r => setTimeout(() => r(v), ms));
const IMG_RE = /\.(png|jpe?g|gif|webp|avif|heic|heif)$/i;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const pick = a => a[Math.random() * a.length | 0];
const report = e => { try { window.onerror(e && e.message ? e.message : String(e)); } catch (x) {} };

/* ===== фон с конфетти ===== */
const CONF = ['#e86fb4', '#f2c14e', '#e8893a', '#6cc4e8', '#9b5fd0', '#c08ae0', '#f59ac8'];
function curl() {
  const turns = rnd(2.6, 4), a = rnd(3.4, 4.6), r = rnd(3.8, 5.2), steps = Math.round(turns * 16);
  let d = '';
  for (let i = 0; i <= steps; i++) {
    const t = i / 16, x = a * t - r * Math.sin(2 * Math.PI * t) - a * turns / 2, y = -r * Math.cos(2 * Math.PI * t);
    d += (i ? 'L' : 'M') + f1(x) + ' ' + f1(y);
  }
  return d;
}
function drawBg() {
  const W = innerWidth, H = Math.max(innerHeight, (window.screen && screen.height) || 0, 600);
  let s = '';
  const n = Math.round(W * H / 2600);
  for (let i = 0; i < n; i++) {
    const L = rnd(7, 13), bend = rnd(-.55, .55) * L;
    s += `<path d="M${f1(-L / 2)} 0Q0 ${f1(bend)} ${f1(L / 2)} 0" stroke="${pick(CONF)}" transform="translate(${f1(rnd(0, W))} ${f1(rnd(0, H))}) rotate(${rnd(0, 360) | 0})"/>`;
  }
  const m = Math.max(6, Math.round(W * H / 24000));
  for (let i = 0; i < m; i++) {
    s += `<path d="${curl()}" stroke="${pick(CONF)}" stroke-width="1.7" transform="translate(${f1(rnd(0, W))} ${f1(rnd(0, H))}) rotate(${rnd(-60, 60) | 0}) scale(${f1(rnd(.85, 1.25))})"/>`;
  }
  $('#bg').innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${s}</g></svg>`;
}

/* ===== конфетти-хлопушка ===== */
const cv = $('#fx'), g2 = cv.getContext('2d');
let parts = [], raf = 0, lastT = 0;
function sizeCanvas() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = innerWidth * d; cv.height = innerHeight * d;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  g2.setTransform(d, 0, 0, d, 0, 0);
}
function spawn(x, y, vx, vy) {
  parts.push({ x: x, y: y, vx: vx, vy: vy, k: Math.random() * 3 | 0, s: rnd(7, 13), c: pick(CONF), r: rnd(0, 6.3), vr: rnd(-.2, .2), ph: rnd(0, 6.3), life: 0 });
  if (!raf) { lastT = 0; raf = requestAnimationFrame(tick); }
}
function burst(x, y) {
  for (let i = 0; i < 110; i++) { const a = rnd(0, 6.283), sp = rnd(4, 13); spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 5); }
  const W = innerWidth, H = innerHeight;
  for (let i = 0; i < 50; i++) { spawn(0, H * .92, rnd(3, 11), -rnd(10, 21)); spawn(W, H * .92, -rnd(3, 11), -rnd(10, 21)); }
}
function tick(t) {
  const dt = lastT ? Math.min(2.5, (t - lastT) / 16.7) : 1;
  lastT = t;
  const W = innerWidth, H = innerHeight;
  g2.clearRect(0, 0, W, H);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vy += .2 * dt; p.vx *= Math.pow(.984, dt); p.vy *= Math.pow(.984, dt);
    if (p.vy > 3) p.vy = 3;
    p.x += (p.vx + Math.sin(p.ph + p.life * .07) * .8) * dt;
    p.y += p.vy * dt; p.r += p.vr * dt; p.life += dt;
    if (p.y > H + 30 || p.life > 700) { parts.splice(i, 1); continue; }
    g2.save(); g2.translate(p.x, p.y); g2.rotate(p.r);
    g2.strokeStyle = p.c; g2.fillStyle = p.c; g2.lineWidth = 3; g2.lineCap = 'round';
    if (p.k === 0) { g2.beginPath(); g2.arc(0, 0, p.s * .6, 0, 1.9); g2.stroke(); }
    else if (p.k === 1) { g2.scale(1, Math.cos(p.ph + p.life * .15)); g2.fillRect(-p.s / 2, -p.s / 5, p.s, p.s / 2.5); }
    else { g2.beginPath(); g2.arc(0, 0, p.s / 4, 0, 6.283); g2.fill(); }
    g2.restore();
  }
  if (parts.length) raf = requestAnimationFrame(tick);
  else { raf = 0; g2.clearRect(0, 0, W, H); }
}

/* ===== рисованные картошки ===== */
const INK = '#4a2a14';
const PALS = [
  { fill: '#f3c56f', hatch: '#c4893d', spot: '#a86d32' },
  { fill: '#e4ad6c', hatch: '#b07434', spot: '#8f5a28' },
  { fill: '#f6d896', hatch: '#cf9e55', spot: '#b5813f' },
  { fill: '#eba98b', hatch: '#c07457', spot: '#a35a40' },
  { fill: '#dba763', hatch: '#a86f30', spot: '#7f5225' },
];
const HEADS = ['tophat', 'cap', 'beanie', 'bucket', 'candle', 'phones'];
const EYEWEAR = ['shades', 'pixel', 'specs', 'stars'];
const NECKS = ['chain', 'bowtie'];
const MOUTHS = ['grin', 'teeth', 'smile', 'cat', 'blep', 'smirk'];
const BRIGHT = ['#ff5c7a', '#7fe0c3', '#ffd35c', '#a78bfa', '#5cc8ff', '#ff9f43'];

function smooth(P) {
  const n = P.length;
  let d = 'M' + f1(P[0][0]) + ' ' + f1(P[0][1]);
  for (let i = 0; i < n; i++) {
    const a = P[(i + n - 1) % n], b = P[i], c = P[(i + 1) % n], e = P[(i + 2) % n];
    d += 'C' + f1(b[0] + (c[0] - a[0]) / 6) + ' ' + f1(b[1] + (c[1] - a[1]) / 6) + ' ' + f1(c[0] - (e[0] - b[0]) / 6) + ' ' + f1(c[1] - (e[1] - b[1]) / 6) + ' ' + f1(c[0]) + ' ' + f1(c[1]);
  }
  return d + 'Z';
}
function bodyPts(b, off) {
  const P = [];
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2;
    const k = 1 + b.a1 * Math.sin(2 * a + b.p1) + b.a2 * Math.sin(3 * a + b.p2) + b.j[i];
    const o = typeof off === 'function' ? off(a) : off;
    P.push([b.cx + Math.cos(a) * (b.rx * k * (1 + .07 * Math.sin(a)) + o), b.cy + Math.sin(a) * (b.ry * k + o)]);
  }
  return P;
}
function wobCircle(x, y, r, sy) {
  const P = [];
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2, k = r * (1 + (Math.random() - .5) * .1); P.push([x + Math.cos(a) * k, y + Math.sin(a) * k * (sy || 1)]); }
  return smooth(P);
}
function starPath(x, y, R) {
  let d = '';
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? R * .48 : R; d += (i ? 'L' : 'M') + f1(x + Math.cos(a) * r) + ' ' + f1(y + Math.sin(a) * r); }
  return d + 'Z';
}

let UID = 0;
function potatoSVG(o) {
  const id = 'pz' + (UID++), pal = o.pal;
  const b = { cx: 70, cy: 112, rx: o.rx, ry: o.ry, a1: rnd(.02, .05), a2: rnd(.015, .035), p1: rnd(0, 6.3), p2: rnd(0, 6.3) };
  const p3 = rnd(0, 6.3), p4 = rnd(0, 6.3);
  const frames = [0, 1, 2].map(() => {
    const bb = Object.assign({}, b, { j: Array.from({ length: 16 }, () => (Math.random() - .5) * .035) });

    const r = p.slot.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height * .45;
    const L = Math.hypot(tx - x, ty - y) || 1;
    setLook(p, (tx - x) / L * 3, (ty - y) / L * 3);
  });
  clearTimeout(lookT);
  lookT = setTimeout(idleLook, 2600);
}

/* ===== мемы из репозитория ===== */
async function listFolder(folder) {
  const host = location.hostname;
  if (!/\.github\.io$/i.test(host)) return null;
  const owner = host.split('.')[0];
  const seg = location.pathname.split('/').filter(Boolean)[0];
  const repo = seg && seg.indexOf('.') < 0 ? seg : host;
  try {
    const r = await Promise.race([fetch('https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + folder), later(6000, null)]);
    if (!r || !r.ok) return null;
    const list = await r.json();
    if (!Array.isArray(list)) return null;
    return list
      .filter(f => f.type === 'file' && IMG_RE.test(f.name))
      .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }))
      .map(f => [(folder ? folder + '/' : '') + encodeURIComponent(f.name), f.download_url]);
  } catch (e) { return null; }
}
function loadImg(srcs) {
  return new Promise(res => {
    const list = srcs.filter(Boolean);
    let i = 0, done = false;
    const end = v => { if (!done) { done = true; res(v); } };
    setTimeout(() => end(null), 12000);
    const next = () => {
      if (i >= list.length) return end(null);
      const src = list[i++], im = new Image();
      im.onload = () => (im.naturalWidth ? end({ src: src, w: im.naturalWidth, h: im.naturalHeight }) : next());
      im.onerror = next;
      im.src = src;
    };
    next();
  });
}

/* ===== тапы ===== */
const COIN = '<svg viewBox="-32 -32 64 64"><circle class="c1" r="24"/><circle class="c2" r="18"/><path class="c3" d="M0 -9L2.4 -3.3L8.6 -2.8L3.9 1.3L5.3 7.3L0 4.1L-5.3 7.3L-3.9 1.3L-8.6 -2.8L-2.4 -3.3Z"/></svg>';
function coin(x, y) {
  const d = document.createElement('div');
  d.className = 'coin';
  d.style.left = x + 'px'; d.style.top = y + 'px';
  d.innerHTML = COIN;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 1300);
}
function tap(P) {
  if (state !== 'play' || P.gone) return;
  P.gone = true;
  const r = P.slot.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height * .5;
  P.slot.classList.add('poof');
  setTimeout(() => { P.slot.style.visibility = 'hidden'; }, 500);
  coin(x, y);
  lookAtPoint(x, y);
  showMeme();
  taps++;
  $('#cnt').textContent = Math.min(taps, CONFIG.taps);
  if (taps >= CONFIG.taps) finish();
}
function nextMeme() {
  if (!memes.length) return null;
  if (!bag.length) {
    bag = shuffle(memes.slice());
    if (bag.length > 1 && bag[bag.length - 1] === lastMeme) bag.unshift(bag.pop());
  }
  return (lastMeme = bag.pop());
}
function showMeme() {
  const m = nextMeme(); if (!m) return;
  while (live.length >= 4) live.shift().remove();
  const W = innerWidth, H = innerHeight;
  const k = Math.min(1, Math.min(W * .62, 340) / m.w, (H * .36) / m.h);
  const w = Math.round(m.w * k), h = Math.round(m.h * k), bw = w + 10, bh = h + 10;
  const el = document.createElement('div'), im = new Image();
  el.className = 'meme';
  im.src = m.src; im.alt = ''; im.draggable = false;
  im.style.width = w + 'px'; im.style.height = h + 'px';
  el.appendChild(im);
  const x0 = bw / 2 + 10, x1 = Math.max(x0, W - bw / 2 - 10);
  const y0 = bh / 2 + 50, y1 = Math.max(y0, H * .74 - bh / 2);
  el.style.left = rnd(x0, x1) + 'px';
  el.style.top = rnd(y0, y1) + 'px';
  el.style.setProperty('--r', rnd(-12, 12).toFixed(1) + 'deg');
  $('#memes').appendChild(el); live.push(el);
  setTimeout(() => el.classList.add('bye'), 1500);
  setTimeout(() => { el.remove(); const i = live.indexOf(el); if (i > -1) live.splice(i, 1); }, 1900);
}

/* ===== конверт и письмо ===== */
function finish() {
  state = 'end';
  setTimeout(() => {
    $('#stage').classList.add('out');
    live.forEach(el => el.classList.add('bye'));
    const env = $('#env');
    env.hidden = false; void env.offsetWidth; env.classList.add('in');
    setTimeout(() => burst(innerWidth / 2, innerHeight * .47), 200);
    setTimeout(() => env.classList.add('open'), 1000);
    setTimeout(() => env.classList.add('peek'), 1650);
    setTimeout(openLetter, 2700);
  }, 800);
}
function openLetter() {
  state = 'done';
  const env = $('#env'), L = $('#letter'), paper = $('#paper');
  paper.innerHTML = '';
  LETTER.split('\n').map(s => s.trim()).filter(Boolean).forEach((t, i) => {
    const p = document.createElement('p');
    p.textContent = t;
    p.style.animationDelay = (0.5 + i * 0.3).toFixed(2) + 's';
    paper.appendChild(p);
  });
  env.classList.add('gone');
  L.hidden = false; L.scrollTop = 0; void L.offsetWidth; L.classList.add('on');
  setTimeout(() => { env.hidden = true; }, 700);
}

/* ===== «живой» рисованный контур и моргание ===== */
let tick2 = 0;
setInterval(() => {
  if (document.hidden || state === 'done') return;
  tick2++;
  POTS.forEach((p, i) => {
    if (p.gone || (tick2 + i) % 3 || !p.els[0]) return;
    p.fi = (p.fi + 1) % 3;
    const F = p.frames[p.fi];
    p.els[0].setAttribute('d', F.fill);
    if (p.els[1]) p.els[1].setAttribute('d', F.fill);
    if (p.els[2]) p.els[2].setAttribute('d', F.ring);
    if (p.els[3]) p.els[3].setAttribute('d', F.sketch);
  });
}, 110);
setInterval(() => {
  if (document.hidden || state === 'done') return;
  const c = POTS.filter(p => !p.gone && p.pupils.length);
  if (!c.length) return;
  const p = pick(c);
  p.svg.classList.add('bl');
  setTimeout(() => p.svg.classList.remove('bl'), 160);
}, 320);

/* ===== старт ===== */
$('#need').textContent = CONFIG.taps;
try { drawBg(); } catch (e) { report(e); }
try { sizeCanvas(); } catch (e) { report(e); }
try { layoutPots(); } catch (e) { report(e); }
(async () => {
  const list = await listFolder('');
  const memeC = list && list.length ? list : CONFIG.memes.map(s => [s]);
  memeC.forEach(c => loadImg(c).then(m => { if (m) memes.push(m); }));
})();

let rsT, lastW = innerWidth;
addEventListener('resize', () => {
  clearTimeout(rsT);
  rsT = setTimeout(() => {
    try { sizeCanvas(); } catch (e) { report(e); }
    if (Math.abs(innerWidth - lastW) > 30) { lastW = innerWidth; try { drawBg(); } catch (e) { report(e); } }
    const box = $('#pots');
    if (state === 'play' && taps === 0 && (Math.abs(box.offsetWidth - builtW) > 30 || Math.abs(box.offsetHeight - builtH) > 120)) { try { layoutPots(); } catch (e) { report(e); } }
  }, 250);
});
</script>
